name: Bug 报告
description: 报告可复现的截图、滚动、拼接或构建问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。长截图结果与 macOS、显示器、目标应用和页面内容有关，请尽量完整填写。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README 的“已知边界”和“常见问题”。
          required: true
        - label: 问题不涉及 DRM 或其他受保护内容。
          required: true
  - type: input
    id: version
    attributes:
      label: MacCap 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 构建来源
      options:
        - GitHub Actions ad-hoc 测试包
        - 本地 ad-hoc 构建
        - 已签名并公证的 GitHub Release
        - swift run 开发构建
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与硬件
      description: 请写明 macOS 版本，以及 Apple Silicon 或 Intel。
      placeholder: 例如 macOS 14.6，M2
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 目标应用与版本
      placeholder: 例如 Safari 17.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 从打开目标页面开始，逐步描述操作、选区和停止方式。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附不包含敏感信息的截图或错误文本。
    validations:
      required: true
